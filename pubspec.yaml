name: portfolio
description: "Ngatia's personal portfolio app"


publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.7.0+11

environment:
  sdk: ^3.10.0


dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  firebase_analytics: ^11.3.3
  firebase_core: ^3.8.0
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  popover: ^0.3.1
  sentry_flutter: ^8.9.0
  url_launcher: ^6.3.1
  pdfx: ^2.8.0
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3+4
  web: ^1.1.0

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  riverpod_generator: ^3.0.3
  build_runner: ^2.7.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/files/
    - assets/audio/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: elvis-ngatia
