name: portfolio
description: "Ngatia's personal portfolio app"


publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.3.0+5

environment:
  sdk: ^3.10.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  popover: ^0.3.1
  url_launcher: ^6.3.1
  pdfx: ^2.8.0
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3+4

dev_dependencies:
  riverpod_generator: ^3.0.3
  build_runner: ^2.7.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/files/
